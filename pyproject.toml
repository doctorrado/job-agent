[project]
name = "jobagent"
version = "0.1.0"
description = "AI-powered job search and application assistant"
readme = "README.md"
authors = [
    { name = "Andres Torrado", email = "zeverikon@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "typer>=0.27.2",
]

[project.scripts]
jobagent = "jobagent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
